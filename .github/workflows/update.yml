name: update-data
on:
  schedule:
    - cron: "0 21 * * 0-4"   # JST 平日 06:00
    - cron: "0 22 * * 0-4"   # JST 平日 07:00
    - cron: "30 22 * * 0-4"  # JST 平日 07:30
    - cron: "0 23 * * 0-4"   # JST 平日 08:00
    - cron: "30 23 * * 0-4"  # JST 平日 08:30
    - cron: "0 3 * * 1-5"    # JST 平日 12:00
    - cron: "30 6 * * 1-5"   # JST 平日 15:30
    - cron: "0 9 * * 1-5"    # JST 平日 18:00
    - cron: "0 10 * * 1-5"   # JST 平日 19:00
    - cron: "0 11 * * 1-5"   # JST 平日 20:00
    - cron: "0 12 * * 1-5"   # JST 平日 21:00
    - cron: "0 14 * * 1-5"   # JST 平日 23:00
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data.json
        timeout-minutes: 30
        run: python update_data.py
      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data: auto update"
      - name: Pull latest before push (avoid race with overlapping runs)
        run: git pull --rebase --autostash origin main
      - name: Push
        run: git push
