name: diag-segments

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run segment TextBlock diagnostic (read-only)
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python diag_segments.py
