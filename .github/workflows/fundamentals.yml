name: update-fundamentals

# 依存構造(売上・設備投資・研究開発費＋前年比)を有報から抽出し
# docs/fundamentals.json を生成。月1＋手動。EDINET_API_KEY を使用。
on:
  schedule:
    - cron: "20 21 6 * *"   # 毎月6日 06:20 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fundamentals
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract fundamentals from EDINET
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python fetch_fundamentals.py
      - name: Commit fundamentals
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add docs/fundamentals.json
          git diff --staged --quiet || git commit -m "fundamentals: monthly update"
          git pull --rebase --autostash || true
          git push || true
